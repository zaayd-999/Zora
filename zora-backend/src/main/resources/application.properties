spring.application.name=zora-backend
server.port=8080

spring.datasource.url=jdbc:oracle:thin:@//192.168.56.101:1521/ORCLPDB1
spring.datasource.username=${SYSTEM}
spring.datasource.password=${anas}
spring.graphql.graphql.enabled=true
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# HikariCP settings
spring.datasource.hikari.minimumIdle=5
spring.datasource.hikari.maximumPoolSize=20
spring.datasource.hikari.idleTimeout=30000
spring.datasource.hikari.maxLifetime=2000000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.poolName=HikariPoolTables

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect 
spring.jpa.hibernate.use-new-id-generator-mappings=false 
spring.jpa.hibernate.ddl-auto=create